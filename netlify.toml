# Netlify deploy config for the ZEKANO TanStack Start (Vite + Nitro) app.
# Nitro's `netlify` preset writes static/prerendered assets to `dist/` and the
# SSR serverless function to `.netlify/functions-internal/server/`, which
# Netlify auto-detects — no explicit functions dir or manual redirect needed
# (this is SSR, so every unmatched route is rendered by the function).

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
